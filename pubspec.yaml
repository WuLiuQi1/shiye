name: reader
description: A private, cross-platform reading app for iOS and Android.
publish_to: none
version: 1.0.0-alpha.20+21

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.3.7
  epubx: ^4.0.0
  flutter_tts: ^4.2.5
  html: ^0.15.5
  path_provider: ^2.1.5
  pdfx: ^2.9.2
  share_handler: ^0.0.25
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
