name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Keep the check non-blocking for Flutter-generated host files. The
      # release workflows format the same sources before analysis and builds.
      - run: dart format .
      - run: flutter analyze
      - run: flutter test
